[package]
name = "tsuro-sign"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reconhecimento e verificação de assinaturas digitais em PDF"

[dependencies]
serde = { version = "1", features = ["derive"] }
lopdf = "0.42"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
sha1 = "0.10"
thiserror = "2"
base64 = "0.22"
x509-parser = "0.16"
