name: Close linked issue

on:
  pull_request:
    types: [closed]

# issues: write closes the issue and posts the comment.
# pull-requests: read loads official closing references. GITHUB_TOKEN only.
permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- tsuro-close-linked-issue -->';
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const { owner, repo } = context.repo;

            if (!pr.merged) {
              core.info(`PR #${prNumber} is not merged. Nothing to close.`);
              return;
            }

            const defaultBranch = context.payload.repository.default_branch;
            if (pr.base.ref !== defaultBranch) {
              core.info(
                `PR #${prNumber} merged into ${pr.base.ref}, not ${defaultBranch}. Nothing to close.`,
              );
              return;
            }

            const linked = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 20) {
                      totalCount
                      nodes {
                        number
                        repository { nameWithOwner }
                      }
                    }
                  }
                }
              }`,
              { owner, repo, number: prNumber },
            );

            const issuesConn = linked.repository.pullRequest.closingIssuesReferences;
            const issues = (issuesConn.nodes || []).filter(Boolean);
            if (issuesConn.totalCount !== 1 || issues.length !== 1) {
              const listed = issues.map((issue) => `#${issue.number}`).join(', ');
              core.info(
                `PR #${prNumber} has ${issuesConn.totalCount} linked issues` +
                  `${listed ? ` (${listed})` : ''}; need exactly 1. Nothing to close.`,
              );
              return;
            }

            const issue = issues[0];
            const here = `${owner}/${repo}`;
            if (issue.repository.nameWithOwner !== here) {
              core.info(
                `PR #${prNumber} is linked to ${issue.repository.nameWithOwner}#${issue.number}, not ${here}. Nothing to close.`,
              );
              return;
            }

            const reverse = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    number
                    state
                    closedByPullRequestsReferences(first: 20, includeClosedPrs: true) {
                      totalCount
                      nodes { number }
                    }
                  }
                }
              }`,
              { owner, repo, number: issue.number },
            );

            const target = reverse.repository.issue;
            const prsConn = target.closedByPullRequestsReferences;
            const prs = (prsConn.nodes || []).filter(Boolean);
            const onlyThisPr = prs.length === 1 && prs[0].number === prNumber;
            if (prsConn.totalCount !== 1 || !onlyThisPr) {
              const listed = prs.map((item) => `#${item.number}`).join(', ');
              core.info(
                `Issue #${issue.number} has ${prsConn.totalCount} linked PRs` +
                  `${listed ? ` (${listed})` : ''}; need exactly #${prNumber}. Nothing to close.`,
              );
              return;
            }

            if (target.state !== 'OPEN') {
              core.info(`Issue #${issue.number} is already ${target.state}. Nothing to close.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100,
            });
            if (!comments.some((comment) => (comment.body || '').includes(MARKER))) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: [
                  `Closed by #${prNumber}.`,
                  '',
                  `Fechada pelo #${prNumber}.`,
                  '',
                  MARKER,
                ].join('\n'),
              });
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed #${issue.number}; linked only to merged PR #${prNumber}.`);
